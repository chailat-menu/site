<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chailat — меню</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Montserrat:wght@300;400;500;600&display=swap&subset=cyrillic,cyrillic-ext,latin" rel="stylesheet">
<style>
:root{
  --paper:#F3EAD3; --card:#F9F3E3; --ink:#262A22; --muted:#6F6A52;
  --sage:#566A48; --sage-soft:#E7E3C7; --line:#D9CCAA; --on-sage:#F9F3E3;
  --serif:"Lora",Georgia,"Times New Roman",serif;
  --sans:"Montserrat","Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{overflow-x:clip;height:100%;-webkit-text-size-adjust:100%}
body{overflow-x:clip;margin:0;min-height:100%;background-color:#25211f;background-image:url('photos/baner.jpeg');background-position:center;background-size:cover;background-attachment:fixed;color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 150px}

/* language dropdown */
.lang{position:relative;flex:0 0 auto}
.lang-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:color-mix(in srgb,var(--card) 85%,transparent);border-radius:999px;padding:0 12px 0 14px;min-height:36px;font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.06em}
.lang-btn svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.lang.open .lang-btn svg{transform:rotate(180deg)}
.lang-menu{display:none;position:absolute;right:0;top:calc(100% + 6px);z-index:60;min-width:130px;margin:0;padding:6px;list-style:none;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(60,50,20,.18)}
.lang.open .lang-menu{display:block}
.lang-menu button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;border:0;background:transparent;border-radius:10px;padding:0 12px;min-height:40px;font-family:var(--sans);font-size:13px;font-weight:500;text-align:left}
.lang-menu button:hover{background:var(--sage-soft)}
.lang-menu button[aria-selected="true"]{color:var(--sage);font-weight:700}
.lang-menu button[aria-selected="true"]::after{content:"✓"}

/* HOME */
.hero{position:relative;text-align:center;padding:16px 16px 24px;margin:0 -16px 0;background:transparent}
.hero-top{position:relative;z-index:2;display:flex;justify-content:flex-end}
.hero .lang-btn{background:rgba(249,243,227,.94);box-shadow:0 3px 14px rgba(0,0,0,.2)}
.sprig{position:absolute;color:var(--sage);opacity:.55;width:120px;height:auto;pointer-events:none}
.sprig.a{left:-22px;top:46px}
.sprig.b{right:-22px;top:150px;transform:scaleX(-1) rotate(8deg)}
.logo{position:relative;margin:clamp(56px,16vw,100px) 0 0;font-family:var(--sans);font-weight:300;font-size:clamp(36px,12vw,58px);letter-spacing:.22em;padding-left:.22em;line-height:1;color:#fff;text-shadow:0 3px 16px rgba(0,0,0,.9)}
.welcome{position:relative;margin:0 auto;padding:8px 18px 0;max-width:44ch;background:transparent;font-size:15px;line-height:1.55;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.9)}
.hint{position:relative;margin:0 auto;padding:9px 18px 15px;max-width:44ch;background:transparent;font-size:14px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.95)}
.gh{margin:28px 0 12px;font-family:var(--sans);font-weight:400;font-size:13px;letter-spacing:.28em;text-align:center;color:#fff;text-shadow:0 1px 7px rgba(0,0,0,.85)}
.grid{display:grid;grid-template-columns:1fr;gap:10px;padding:8px;border:1px solid var(--line);border-radius:20px;background:rgba(249,243,227,.96);box-shadow:0 8px 22px rgba(0,0,0,.18)}
.card{position:relative;display:flex;align-items:center;justify-content:center;min-height:135px;padding:16px;border:0;border-radius:16px;overflow:hidden;isolation:isolate;text-align:center;color:#fff;background-color:#3b3a2c;background-size:cover;background-position:center;transition:transform .15s}
.card::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(rgba(20,16,8,.42),rgba(20,16,8,.5))}
.card:active{transform:scale(.985)}
.card .bgico{position:absolute;z-index:-2;right:-14px;bottom:-22px;width:130px;height:130px;color:#fff;opacity:.12}
.card .bgico svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.card.c0{background-image:linear-gradient(135deg,#8a6a3c,#4a3820)}
.card.c1{background-image:linear-gradient(135deg,#566A48,#2f3d28)}
.card.c2{background-image:linear-gradient(135deg,#a0763f,#55381a)}
.card.c3{background-image:linear-gradient(135deg,#6f7d52,#394428)}
.card.c4{background-image:linear-gradient(135deg,#8a5a3a,#47281a)}
.card.c5{background-image:linear-gradient(135deg,#9a7b45,#4e3b1c)}
.ico{width:44px;height:44px;color:var(--sage)}
.ico svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ct{font-family:var(--sans);font-weight:500;font-size:clamp(18px,5.4vw,22px);letter-spacing:.04em;line-height:1.25;text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.45)}
.cn{position:absolute;top:14px;right:14px;min-width:26px;height:26px;padding:0 8px;border-radius:13px;background:var(--sage-soft);color:var(--sage);display:grid;place-items:center;font-family:var(--sans);font-size:12px;font-weight:600}
.info{margin-top:30px;padding:8px 18px 16px;border:1px solid var(--line);border-radius:22px;background:color-mix(in srgb,var(--card) 72%,var(--paper));overflow:hidden}
.info-row{display:grid;grid-template-columns:54px 1fr;align-items:center;gap:16px;padding:17px 0;border-bottom:1px solid var(--line)}
.info-ico{width:54px;height:54px;display:grid;place-items:center;border-radius:50%;background:var(--sage);color:var(--on-sage)}
.info-ico svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.info small{display:block;font-family:var(--sans);font-size:13px;color:var(--muted);margin-bottom:4px}
.info b{font-family:var(--sans);font-size:15px;font-weight:500;line-height:1.4}
.info b a:hover{text-decoration:underline;text-underline-offset:3px}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.links a{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;background:var(--paper);color:var(--sage);font-family:var(--sans);font-weight:500;font-size:14px;transition:transform .15s,background .15s}
.links a:hover{background:var(--sage-soft);transform:translateY(-1px)}
.links svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* LIST */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:0 -16px;background:var(--paper);border-bottom:1px solid var(--line);border-radius:0 0 18px 18px;box-shadow:0 8px 20px rgba(0,0,0,.12)}
.top-row{display:flex;align-items:center;gap:8px;padding:8px 16px 4px}
.back{flex:0 0 auto;width:42px;height:42px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:var(--card)}
.back svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top h1{flex:1;margin:0;font-family:var(--sans);font-weight:500;font-size:17px;line-height:1.2;overflow:hidden;text-overflow:ellipsis}
.chips-in{display:flex;gap:8px;overflow-x:auto;padding:8px 16px 10px;scrollbar-width:none}
.chips-in::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;padding:0 15px;min-height:36px;display:inline-flex;align-items:center;font-family:var(--sans);font-size:13px;font-weight:500;white-space:nowrap;background:transparent}
.chip[aria-current="true"]{background:var(--sage);border-color:var(--sage);color:var(--on-sage)}
.sub{display:flex;align-items:center;gap:14px;margin:26px 0 4px;font-family:var(--sans);font-weight:500;font-size:15px;letter-spacing:.12em;color:#fff;text-shadow:0 1px 7px rgba(0,0,0,.9)}
.sub::before,.sub::after{content:"";flex:1;height:1px;background:rgba(249,243,227,.72)}
.item{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center;margin:12px 0;padding:12px;border:1px solid var(--line);border-radius:20px;background:rgba(249,243,227,.96);box-shadow:0 5px 16px rgba(20,16,10,.2)}
.ph{position:relative;width:76px;height:76px;border-radius:16px;overflow:hidden;background:var(--sage-soft);border:1px solid var(--line);display:grid;place-items:center;color:var(--sage)}
.ph svg{width:40px;height:40px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.intro{margin:18px 0 0;padding:16px 18px;border-radius:18px;background:var(--card);border:1px solid var(--line);text-align:center}
.intro h2{margin:0 0 6px;font-family:var(--sans);font-weight:500;font-size:14px;letter-spacing:.2em;color:var(--sage)}
.intro p{margin:0;font-size:15px;line-height:1.5;color:var(--ink)}
.welcome{position:relative;margin:22px auto 0;max-width:44ch;font-size:15px;line-height:1.55;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.95)}
.hook{margin:36px 0 0;padding:26px 16px;text-align:center;border-top:1px solid rgba(249,243,227,.72)}
.hook p{margin:0;font-size:clamp(20px,6vw,26px);font-style:italic;line-height:1.35;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.9)}
.hook b{display:block;margin-top:8px;font-family:var(--sans);font-weight:400;font-style:normal;font-size:clamp(22px,7vw,30px);letter-spacing:.24em;padding-left:.24em;color:#F3EAD3;text-shadow:0 2px 8px rgba(0,0,0,.9)}
.item:last-child{border-bottom:1px solid var(--line)}
.nm{font-size:16px;font-weight:500;line-height:1.3;color:var(--ink)}
.pr{margin-top:2px;font-family:var(--sans);font-size:14px;font-weight:600;color:var(--sage);font-variant-numeric:tabular-nums}
.pr.na{color:var(--muted);font-weight:500}
.ctl{display:flex;justify-content:flex-end}
.add{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--sage);background:transparent;color:var(--sage);font-size:24px;line-height:1;display:grid;place-items:center;padding:0}
.add:active{background:var(--sage);color:var(--on-sage)}
.add[disabled]{opacity:.3;cursor:not-allowed}
.step{display:inline-flex;align-items:center;background:var(--sage);color:var(--on-sage);border-radius:999px;height:42px}
.step button{width:38px;height:42px;border:0;background:transparent;color:inherit;font-size:22px;line-height:1;padding:0}
.step span{min-width:20px;text-align:center;font-family:var(--sans);font-weight:600;font-size:15px}

/* Cart bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));transform:translateY(110%);transition:transform .25s ease;pointer-events:none}
.bar.on{transform:none;pointer-events:auto}
.bar button{display:flex;width:100%;max-width:528px;margin:0 auto;align-items:center;justify-content:space-between;gap:12px;border:0;border-radius:18px;background:var(--sage);color:var(--on-sage);padding:14px 18px;min-height:58px;box-shadow:0 6px 24px rgba(0,0,0,.22);font-family:var(--sans);font-weight:600;font-size:15px}
.bar .cnt{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:14px;background:var(--on-sage);color:var(--sage);font-size:14px;padding:0 8px;margin-right:10px}
.bar .sum{font-variant-numeric:tabular-nums}

/* Sheet */
.ov{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:90%;display:flex;flex-direction:column;background:var(--card);border-radius:24px 24px 0 0;transform:translateY(105%);transition:transform .28s ease;max-width:560px;margin:0 auto;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet.on{transform:none}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 10px}
.sh-head h3{margin:0;font-family:var(--sans);font-weight:400;font-size:18px;letter-spacing:.16em}
.x{width:40px;height:40px;border:0;background:transparent;font-size:26px;line-height:1;border-radius:50%}
.sh-body{overflow-y:auto;padding:0 20px;flex:1}
.note{margin:0 0 6px;color:var(--muted);font-size:14px}
.tbl{display:flex;align-items:center;gap:10px;margin:8px 0 6px;font-family:var(--sans);font-size:14px}
.tbl input{width:84px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:8px 10px;font:inherit;font-size:16px}
.lines{list-style:none;margin:0;padding:0}
.line{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.line .t{font-weight:500}
.line .q{font-family:var(--sans);font-weight:600;color:var(--sage);margin-right:6px}
.line .s{font-family:var(--sans);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.line .ctl{grid-row:1 / span 2;grid-column:2}
.empty{padding:34px 0;text-align:center;color:var(--muted)}
.tot{padding:12px 20px 4px;font-family:var(--sans);font-size:14px}
.tot div{display:flex;justify-content:space-between;padding:3px 0;color:var(--muted);font-variant-numeric:tabular-nums}
.tot .all{color:var(--ink);font-weight:600;font-size:18px;padding-top:8px}
.acts{display:flex;gap:10px;padding:10px 20px calc(16px + env(safe-area-inset-bottom,0px))}
.btn{flex:1;min-height:50px;border-radius:14px;border:1.5px solid var(--sage);background:transparent;color:var(--sage);font-family:var(--sans);font-weight:600;font-size:14px;padding:0 14px}
.btn.main{background:var(--sage);color:var(--on-sage)}
.btn.main[disabled]{opacity:.4}
.btn.ghost{flex:0 0 auto;border-color:var(--line);color:var(--muted)}

/* Waiter view */
.sheet.show .ctl,.sheet.show .note,.sheet.show .x,.sheet.show .tbl{display:none}
.tblshow{display:none;font-family:var(--sans);font-size:15px;color:var(--muted);margin:2px 0 4px}
.sheet.show .tblshow{display:block}
.sheet.show .line{padding:15px 0}
.sheet.show .line .t{font-size:21px;line-height:1.3}
.sheet.show .line .q{font-size:21px}
.sheet.show .line .s{font-size:15px;grid-row:auto}
.sheet.show .sh-head h3{font-size:20px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:700px){.sprig{width:150px}.sprig.a{left:-10px}.sprig.b{right:-10px}}
</style>
</head>

<div class="wrap" id="app"></div>

<div class="bar" id="bar">
  <button type="button" id="openCart">
    <span><span class="cnt" id="barCnt">0</span><span id="barLbl"></span></span>

</div>

<div class="ov" id="ov"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle" aria-hidden="true">
  <div class="sh-head">
    <h3 id="shTitle"></h3>
    <button type="button" class="x" id="closeCart" aria-label="Close">×</button>
  </div>

    <button type="button" class="btn main" id="showBtn"></button>
  </div>
</section>

function money(n){
  var s = (Math.round(n*100)/100).toString().split(".");
  var a = s[0].replace(/\B(?=(\d{3})+(?!\d))/g,"\u00A0");
  return a + (s[1] ? ","+(s[1].length<2? s[1]+"0": s[1]) : "") + "\u00A0₸";
}

function ctlHTML(key){

  $("app").innerHTML = h;
}
function renderList(sec){
  var h = '<div class="top"><div class="top-row"><a class="back" href="#/" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a>'+
    '<h1>'+esc(sec[lang])+'</h1>'+langHTML()+'</div><div class="chips-in" id="chips">'+
    SECS.map(function(s){ return '<a class="chip" href="#/s/'+s.id+'"'+(s.id===sec.id?' aria-current="true"':'')+'>'+esc(s[lang])+'</a>'; }).join("")+
    '</div></div><section class="intro"><h2>'+esc(sec[lang].toUpperCase())+'</h2><p>'+esc(INTRO[sec.id][lang])+'</p></section><main>';
  sec.cats.forEach(function(cid){
    var c = CATS[cid];
    if(sec.cats.length>1) h += '<h2 class="sub">'+esc(c[lang])+'</h2>';
    c.items.forEach(function(it,i){
      var key = cid+"-"+i;
      var pho = PHOTOS[it[0]] ? '<img src="'+esc(PHOTOS[it[0]])+'" alt="'+esc(dn(it[0]))+'" loading="lazy" onerror="this.remove()">' : '';
      h += '<div class="item"><div class="ph"><svg viewBox="0 0 48 48" aria-hidden="true">'+ICONS[CAT_SEC[cid]]+'</svg>'+pho+'</div><div><div class="nm">'+esc(dn(it[0]))+'</div>'+
        '<div class="pr'+(it[1]==null?' na':'')+'">'+(it[1]==null? t("na") : money(it[1]))+'</div></div>'+
        '<div class="ctl" id="ctl-'+key+'">'+ctlHTML(key)+'</div></div>';
    });
  });
  h += '</main>' + infoHTML() + hookHTML();
  $("app").innerHTML = h;
  var cur = document.querySelector('.chip[aria-current="true"]');
  if(cur){ var box = $("chips"); box.scrollLeft = cur.offsetLeft - box.clientWidth/2 + cur.offsetWidth/2; }
}
function renderStatic(){
  $("shTitle").textContent = t("cart").toUpperCase();
  $("note").textContent = t("note");
  $("tblLbl").textContent = t("table");
  $("clear").textContent = t("clear");
  $("barLbl").textContent = t("open");
  document.documentElement.lang = lang === "kk" ? "kk" : lang;
}
var lastRoute = "";
function render(keepScroll){
  var m = location.hash.match(/^#\/s\/([a-z]+)/), sec = null;
  if(m) SECS.forEach(function(s){ if(s.id===m[1]) sec = s; });
  var key = sec ? sec.id : "home";
  var y = window.pageYOffset;
  if(sec) renderList(sec); else renderHome();
  if(!keepScroll && key!==lastRoute) window.scrollTo(0,0); else if(keepScroll) window.scrollTo(0,y);
  lastRoute = key;
  renderStatic(); updateBar();
}

/* ---------- Cart ---------- */
function totals(){
  var n=0, s=0;
  Object.keys(cart).forEach(function(k){ n += cart[k]; s += cart[k]*flat[k].price; });
  return {n:n, sub:s, svc:s*SERVICE, all:s*(1+SERVICE)};
}
function persist(){ save("chailat_cart", JSON.stringify(cart)); }
function change(key, d){
  var q = (cart[key]||0) + d;
  if(q<=0) delete cart[key]; else cart[key] = Math.min(q,99);
  persist();
  var el = $("ctl-"+key); if(el) el.innerHTML = ctlHTML(key);
  updateBar();
  if(sheetOpen) renderSheet();
}
var sheetOpen = false, showMode = false;
function updateBar(){
  var T = totals();
  $("barCnt").textContent = T.n;
  $("barSum").textContent = money(T.all);
  $("bar").classList.toggle("on", T.n>0 && !sheetOpen);
}
function renderSheet(){
  var keys = Object.keys(cart), T = totals(), h = "";
  keys.forEach(function(k){
    var it = flat[k], q = cart[k];
    h += '<li class="line"><div class="t"><span class="q">'+q+'×</span>'+esc(dn(it.name))+'</div>'+
         '<div class="ctl">'+ctlHTML(k)+'</div><div class="s">'+money(it.price*q)+'</div></li>';
  });
  $("lines").innerHTML = h || '<li class="empty">'+t("empty")+'</li>';
  $("tot").innerHTML = keys.length ?
    '<div><span>'+t("sub")+'</span><span>'+money(T.sub)+'</span></div>'+
    '<div><span>'+t("svc")+'</span><span>'+money(T.svc)+'</span></div>'+
    '<div class="all"><span>'+t("total")+'</span><span>'+money(T.all)+'</span></div>' : "";
  if(!keys.length && showMode){ showMode = false; $("sheet").classList.remove("show"); }
  $("showBtn").textContent = showMode ? t("back") : t("show");
  $("showBtn").disabled = !keys.length;
  $("clear").style.display = keys.length && !showMode ? "" : "none";
  $("tblShow").textContent = table ? t("tableShow")+" № "+table : "";
}
function openSheet(){
  sheetOpen = true; showMode = false;
  $("sheet").classList.remove("show");
  renderSheet();
  $("ov").classList.add("on"); $("sheet").classList.add("on");
  $("sheet").setAttribute("aria-hidden","false");
  document.body.style.overflow = "hidden";
  updateBar();
  setTimeout(function(){ $("closeCart").focus(); }, 50);
}
function closeSheet(){
  sheetOpen = false; showMode = false;
  $("ov").classList.remove("on"); $("sheet").classList.remove("on","show");
  $("sheet").setAttribute("aria-hidden","true");
  document.body.style.overflow = "";
  updateBar();
  $("openCart").focus({preventScroll:true});
}

/* ---------- Events ---------- */
document.addEventListener("click", function(e){
  var b = e.target.closest("[data-act]");
  if(b){ change(b.dataset.key, b.dataset.act==="inc" ? 1 : -1); return; }
  var l = e.target.closest("[data-lang]");
  if(l){ lang = l.dataset.lang; save("chailat_lang", lang); render(true); if(sheetOpen) renderSheet(); return; }
  var lb = e.target.closest("#langBtn");
  var box = document.getElementById("lang");
  if(lb){ var o = box.classList.toggle("open"); lb.setAttribute("aria-expanded", o); return; }
  if(box && box.classList.contains("open")){ box.classList.remove("open"); }
});
$("openCart").addEventListener("click", openSheet);
$("closeCart").addEventListener("click", closeSheet);
$("ov").addEventListener("click", closeSheet);
document.addEventListener("keydown", function(e){ if(e.key==="Escape"){ var lg=document.getElementById("lang"); if(lg) lg.classList.remove("open"); if(sheetOpen) closeSheet(); } });
$("clear").addEventListener("click", function(){
  cart = {}; persist();
  Array.prototype.forEach.call(document.querySelectorAll('[id^="ctl-"]'), function(el){ if(el.id.indexOf("ctl-")===0 && el.id.indexOf("-")>0 && !el.closest("#sheet")) el.innerHTML = ctlHTML(el.id.slice(4)); });
  renderSheet(); updateBar();
});
$("showBtn").addEventListener("click", function(){
  showMode = !showMode;
  $("sheet").classList.toggle("show", showMode);
  renderSheet();
  $("sheet").querySelector(".sh-body").scrollTop = 0;
});
$("tbl").value = table;
$("tbl").addEventListener("input", function(){
  table = this.value.replace(/[^\d]/g,"").slice(0,4); this.value = table; save("chailat_table", table);
});
window.addEventListener("hashchange", function(){ render(false); });

render(false);
})();
</script>
</body>
</html>
